<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Black puzzle piece base -->
  <rect x="40" y="60" width="120" height="80" fill="#000000"/>
  
  <!-- Top circle (black) -->
  <circle cx="100" cy="40" r="30" fill="#000000"/>
  
  <!-- Bottom right circle (coral/pink) -->
  <circle cx="170" cy="120" r="30" fill="#FF6B6B" stroke="#000000" stroke-width="4"/>
  
  <!-- Bottom left circle (yellow) -->
  <circle cx="70" cy="120" r="30" fill="#FFD93D"/>
  
  <!-- Center rectangle (blue) -->
  <rect x="90" y="80" width="20" height="60" fill="#4ECDC4"/>
</svg>
